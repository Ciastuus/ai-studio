name: Publish M-RP LSPD Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser editor and native exporter JavaScript
        run: |
          node --check studio.js
          node --check native-export.js
          node --input-type=module <<'JS'
          import { zipStore, encodeDXT3 } from './native-export.js';
          const data=new Uint8Array(4*4*4).fill(255);
          const texture=encodeDXT3(data,4,4);
          if(texture.length!==16) throw Error('DXT3 failed');
          const archive=zipStore([['test.txt','M-RP']]);
          if(archive.length<100)throw Error('ZIP writer failed');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
