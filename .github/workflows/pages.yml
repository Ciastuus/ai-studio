name: Publish M-RP LSPD Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mrp-renderware-native-v2
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser editor and native exporter JavaScript
        run: |
          node --check studio.js
          node --check native-export.js
          node --check viewer.js
          node --check viewer-rw.js
          node --check viewer-assemblies.js
          node --check viewer-native-export.js
          node --check viewer-decals.js
          node --check vendor/dff-loader.es.js
          node --input-type=module <<'JS'
          import { zipStore, encodeDXT3 } from './native-export.js';
          const data=new Uint8Array(4*4*4).fill(255);
          const texture=encodeDXT3(data,4,4);
          if(texture.length!==16) throw Error('DXT3 failed');
          const archive=zipStore([['test.txt','M-RP']]);
          if(archive.length<100)throw Error('ZIP writer failed');
          JS
      - name: Smoke test viewer in real Chromium
        run: |
          npm install --no-save playwright@1.56.1 three@0.161.0
          node tests/native-materials.mjs
          node tests/panel-decal-follow.mjs
          node tests/viewer-native-export.mjs
          node tests/police-parent-hierarchy.mjs
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/tmp/mrp-viewer-http.log 2>&1 &
          node tests/viewer-smoke.mjs
          node tests/decals-smoke.mjs
      - name: Upload rendered viewer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke-preview
          path: viewer-smoke.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
